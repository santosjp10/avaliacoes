name: Publicar questão aprovada

# Dispara quando um(a) curador(a) aplica o rótulo "aprovada" a uma contribuição.
# Só quem tem permissão no repositório consegue aplicar rótulos.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: banco-aberto
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event.label.name == 'aprovada' && contains(github.event.issue.body, 'Dados da questão (não edite)')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUM: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar e gravar a questão
        id: aprovar
        continue-on-error: true
        run: node scripts/aprovar-issue.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
      - name: Avisar problema
        if: steps.aprovar.outcome != 'success'
        env:
          ERRO: ${{ steps.aprovar.outputs.erro }}
        run: |
          gh issue comment "$NUM" --body "⚠️ Não foi possível publicar esta questão: $ERRO
          Corrija a questão (ou peça ao autor que envie de novo pelo app) e aplique o rótulo **aprovada** outra vez."
          gh issue edit "$NUM" --remove-label aprovada
          exit 1
      - name: Publicar no repositório
        env:
          ID: ${{ steps.aprovar.outputs.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/banco
          git commit -m "Banco aberto: publica questão $ID (#$NUM)"
          git push
      - name: Responder e fechar
        env:
          ID: ${{ steps.aprovar.outputs.id }}
        run: |
          gh issue comment "$NUM" --body "✅ Questão publicada no Banco Aberto como **$ID**. Ela aparece no app (Banco compartilhado) em alguns minutos. Obrigado pela contribuição!"
          gh issue close "$NUM" --reason completed
          gh workflow run deploy.yml
